<!doctype html>
<!--
  The game's only page. Inside the store apps (Capacitor bundles web/) it is the whole
  app; opened in a browser it is the website: the invite page for "/<CODE>" (served
  through the single-page fallback) and for "/". All UI is drawn by /js/main.js into the
  empty roots below (#look is the photo shown while a finger holds it; #toast is the one
  toast, ui.js slides it in with data-on). #app grows with its screen and clips only what
  an animation moves past it for a moment (a card of the reveal popping or shaking, the
  leaderboard's shake), so an animation never makes the page scroll. /css/app.css is built from styles/app.css
  (scripts/helpers/styles.sh). Scaling is off: double-tap zoom would enlarge the whole UI
  by accident (pinch zoom is off in the apps' web view anyway). The title and descriptions
  restate APP.name for link previews, the
  Content-Security-Policy restates the environments' addresses (ENVIRONMENTS: production,
  and staging for the test builds), the only places the app talks to, and the
  theme colour restates the dark blue of styles/app.css (all pinned by
  test/unit/config.test.js).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://who-shot-it.nils-plum.workers.dev https://who-shot-it-staging.nils-plum.workers.dev; connect-src 'self' https://who-shot-it.nils-plum.workers.dev wss://who-shot-it.nils-plum.workers.dev https://who-shot-it-staging.nils-plum.workers.dev wss://who-shot-it-staging.nils-plum.workers.dev; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Who Shot It?</title>
<meta name="description" content="The party game with the photos on your phones: guess whose photo it is. Free, no account.">
<meta property="og:title" content="Who Shot It?">
<meta property="og:description" content="Guess whose photo it is. Join my game!">
<meta property="og:type" content="website">
<meta name="theme-color" content="#15121f">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div id="app" class="overflow-clip"></div>
<div id="sheet"></div>
<div id="cover"></div>
<div id="look"></div>
<div id="banner"></div>
<div id="toast" class="fixed bottom-[calc(--spacing(6)+env(safe-area-inset-bottom))] left-1/2 z-80 max-w-[90vw] -translate-x-1/2 translate-y-35 rounded-2xl bg-white px-4.5 py-3 text-center text-navy transition-transform duration-300 data-on:translate-y-0" role="status" aria-live="polite"></div>
<noscript><p class="mt-4 text-center text-muted">Please turn on JavaScript.</p></noscript>
</body>
</html>
