<!doctype html>
<!--
  The game's only page. Inside the store apps (Capacitor bundles web/) it is the whole
  app; opened in a browser it is the website: the invite page for "/<CODE>" (served
  through the single-page fallback) and for "/". All UI is drawn by /js/main.js into the
  empty roots below. The title and descriptions restate APP.name for link previews, and
  the Content-Security-Policy restates SERVER.origin, the only place the app talks to
  (both pinned by test/unit/config.test.js).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://who-shot-it.nils-plum.workers.dev; connect-src 'self' https://who-shot-it.nils-plum.workers.dev wss://who-shot-it.nils-plum.workers.dev; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Who Shot It?</title>
<meta name="description" content="The party game with the photos on your phones: guess whose photo it is. Free, no account.">
<meta property="og:title" content="Who Shot It?">
<meta property="og:description" content="Guess whose photo it is. Join my game!">
<meta property="og:type" content="website">
<meta name="theme-color" content="#15121f">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="cover"></div>
<div id="banner"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="status">Please turn on JavaScript.</p></noscript>
</body>
</html>
