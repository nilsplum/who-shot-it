<!doctype html>
<!--
  The page of every draft: scripts/helpers/drafts.mjs serves it at /<draft>/, and
  kit/page.js fills #page from the draft's draft.js (title, note, controls, and the
  draft's screen in phone-sized frames). It loads nothing from anywhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/drafts.css">
<script type="module" src="/kit/page.js"></script>
</head>
<body>
<main id="page"></main>
</body>
</html>
