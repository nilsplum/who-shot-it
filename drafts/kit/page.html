<!doctype html>
<!--
  The page of every draft: scripts/helpers/drafts.mjs serves it at /<draft>/, and
  kit/page.js fills #page: the top bar with every draft, the choices, and the draft's
  screen in phone-sized frames (from its draft.js). The scrollbar's room is kept even
  when nothing scrolls, so the phones' fit never changes when it appears. It loads nothing
  from anywhere else.
-->
<html lang="en" class="[scrollbar-gutter:stable]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/drafts.css">
<script type="module" src="/kit/page.js"></script>
</head>
<body>
<div id="page"></div>
</body>
</html>
