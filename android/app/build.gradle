// The Android app's build. The version comes from package.json (the one place it is set):
// versionName is "1.2.3". versionCode is the build number ./scripts/release-apps.sh passes in
// (-PbuildNumber, `buildNumber` in web/shared/config.js: the version as a number times ten
// plus the environment's digit, 102030 or 102031), so every upload counts up and says which
// server it talks to; a release bundle made any other way refuses to build, so none can reach
// Google Play by hand with the wrong number or server. A debug build (./scripts/dev.sh android)
// needs no number. Release builds are signed by ./scripts/release-apps.sh with the upload key
// from secrets/ (passed in as Android Studio's own "injected signing" properties, so no
// password is stored here).
// Its one library that is not Capacitor's is Google Play's In-App Review (below).
apply plugin: 'com.android.application'

def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def buildNumber = project.findProperty('buildNumber')
if (buildNumber == null && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Release builds come only from ./scripts/release-apps.sh staging|production android (it sets the build number and the server).')
}

android {
    namespace = "com.hivedone.whoshotit"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hivedone.whoshotit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((buildNumber ?: '1') as int)
        versionName appVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // Google Play's own rating card (PhonePlugin.requestReview), the only way an app may show
    // it. Google's Play Core SDK terms: free to ship, not to change; approved by the operator as
    // the one exception to the open-source rule (AGENTS.md, Third-Party Services). It brings
    // Play Core Common and Google Play services Basement and Tasks with it; all four are named in
    // web/vendor/google-play-review.LICENSE.txt and on the legal page. Pinned exactly.
    implementation "com.google.android.play:review:2.0.2"
}

apply from: 'capacitor.build.gradle'
